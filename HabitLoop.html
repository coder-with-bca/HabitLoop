/* Layout and typography */

ton,.choice button{border:1px solid var(--line);border-radius:9px;background:var(--surface2);color:var(--ink);min-height:42px;padding:8px 14px;font-weight:700}.button:hover,.nav button:hover,.tabs button:hover,.choice button:hover{border-color:var(--accent)}.button.primary{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}.button.danger{color:#f76f75}.nav button{min-width:42px}.tabs{display:flex;gap:7px;margin:20px 0 18px}.tabs button[aria-selected="true"],.choice button[aria-pressed="true"]{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}.storage{color:var(--muted);font-size:12px}.metric{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:17px;margin:18px 0}.metricTitle{display:flex;justify-content:space-between;gap:10px;color:var(--accent);font-weight:800;font-size:11px;letter-spacing:.1em;text-transform:uppercase}.metricTitle span{color:var(--muted);font-weight:400;letter-spacing:0;text-transform:none}.chart{height:90px;display:flex;align-items:flex-end;gap:3px;border-bottom:1px solid var(--line);margin:16px 0 5px}.barSlot{flex:1;height:100%;display:flex;align-items:flex-end;min-width:3px}.bar{width:100%;min-height:2px;border-radius:3px 3px 0 0;background:linear-gradient(0deg,var(--accent2),var(--accent))}.bar.future{background:var(--track)}.axis{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.rings{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:10px;margin-top:16px}.ringCard{text-align:center;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:15px 8px}.ring{position:relative;width:86px;height:86px;display:grid;place-items:center;margin:auto auto 8px}.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:9}.ring .track{stroke:var(--track)}.ring .progress{stroke:var(--accent);stroke-linecap:round}.ring strong{font-size:15px}.ringCard b{display:block;font-size:12px;overflow-wrap:anywhere}.ringCard small{color:var(--muted)}.gridScroll{overflow:auto;border:1px solid var(--line);border-radius:10px;scrollbar-color:var(--line) var(--surface)}table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:12px}th,td{height:44px;padding:4px 5px;text-align:center;border-bottom:1px solid var(--line)}thead th{font-size:11px;color:var(--muted)}tbody tr:last-child th,tbody tr:last-child td{border-bottom:none}.habitCol{position:sticky;left:0;z-index:2;background:var(--surface);min-width:170px;max-width:220px;text-align:left;padding-left:12px;box-shadow:1px 0 var(--line)}thead .habitCol{z-index:3}.dayCol{min-width:34px}.statCol{min-width:60px}.activeDay{color:var(--accent)}.habitName{border:0;background:transparent;color:var(--ink);font-weight:700;text-align:left;overflow-wrap:anywhere}.tick{border:1px solid var(--line);border-radius:50%;background:var(--surface2);color:var(--onaccent);height:25px;width:25px;padding:0;line-height:20px}.tick.on{background:var(--accent);border-color:var(--accent);font-weight:900}.bottom{margin-top:20px}.backup{border-top:1px solid var(--line);margin-top:20px;padding-top:17px}.empty{text-align:center;border:1px dashed var(--line);padding:32px 16px;border-radius:12px;color:var(--muted)}.empty h3{color:var(--ink);margin-bottom:5px}.list{display:grid;gap:9px}.listItem{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px}.listItem button{flex-shrink:0}.yearGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.yearCell{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:16px}.yearCell strong{font-size:25px}.yearCell button{margin-top:10px;width:100%}footer{padding:5px 25px 35px;text-align:center;color:var(--muted);font-size:12px}

/* Dialogs and onboarding */
.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:18px;background:#000b}.dialog{width:min(100%,470px);max-height:90vh;overflow:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:25px;box-shadow:0 25px 75px #0008}.dialog h2{font-size:27px;letter-spacing:-.035em}.dialog label{display:block;font-weight:700;font-size:13px;margin:15px 0 6px}.dialog input{width:100%;height:46px;padding:0 12px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px}.dialogActions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:24px}.choice{display:flex;gap:8px;flex-wrap:wrap}.welcome{min-height:calc(100vh - 70px);display:grid;place-items:center;padding:25px;background:radial-gradient(circle at 85% 10%,var(--hero),var(--bg) 55%)}.welcomeCard{width:min(100%,560px);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:clamp(24px,5vw,43px);box-shadow:0 25px 65px var(--shadow)}.welcomeCard h1{font-size:clamp(34px,6vw,50px);line-height:1.1;letter-spacing:-.055em}.welcomeCard p{color:var(--muted)}.welcomeCard label{display:block;font-weight:700;font-size:13px;margin:15px 0 6px}.welcomeCard input{display:block;width:100%;height:46px;padding:0 12px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px}.progress{color:var(--accent);font-weight:800;letter-spacing:.1em;font-size:12px;text-transform:uppercase}@media(max-width:650px){.header small{display:none}.hero{padding-top:34px}.stats{gap:20px}.toolbarRight{width:100%;justify-content:space-between}.nav{gap:4px}.button,.nav button{padding:7px 10px}.tabs button{flex:1}.habitCol{min-width:140px;max-width:155px}.metricTitle{flex-wrap:wrap}}@media print{.headerActions,.toolbarRight,.tabs,.bottom,.backup,.dialog,.overlay,.yearCell button{display:none!important}.main{padding:0}.panel{box-shadow:none;border:0}.gridScroll{overflow:visible}table{font-size:9px}body <body data-theme="RCB">
<div id="app"></div><div id="modal"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
<script>
(() => {
'use strict';
/* State and validation */
const STORE='habitloop.v1', THEME_GROUPS={IPL:['CSK','MI','RCB','KKR','SRH','DC','RR','PBKS','LSG','GT'],ANIME:['Naruto','Demon Slayer','One Piece','Dragon Ball','Jujutsu Kaisen','Attack on Titan']}, THEMES=Object.values(THEME_GROUPS).flat(), MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const THEME_SWATCHES={"CSK": ("#f2b519", "#1c4e91"), "MI": ("#164786", "#e5bd70"), "RCB": ("#d93747", "#f2c371"), "KKR": ("#483069", "#e9ba65"), "SRH": ("#e96620", "#1b1410"), "DC": ("#153f76", "#ff7076"), "RR": ("#e754a0", "#283d92"), "PBKS": ("#a82035", "#9a9aab"), "LSG": ("#2998cc", "#ba4c17"), "GT": ("#1d3d58", "#e3bb73"), "Naruto": ("#2b2a31", "#b54112"), "Demon Slayer": ("#35765e", "#8ce0a5"), "One Piece": ("#227aa4", "#b92d39"), "Dragon Ball": ("#ec7625", "#2851ab"), "Jujutsu Kaisen": ("#7254ad", "#b8a5f7"), "Attack on Titan": ("#738e62", "#d9b980")};
const $=(s,root=document)=>root.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0'), key=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`, now=()=>new Date(), today=()=>{let d=now();return key(d.getFullYear(),d.getMonth(),d.getDate())};
const validDate=k=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(k))return false;let [y,m,d]=k.split('-').map(Number);return y>=1900&&y<=9999&&m>=1&&m<=12&&d>=1&&d<=new Date(y,m,0).getDate()};
function validate(input){
 if(!input||typeof input!=='object'||Array.isArray(input)||input.version!==1||!input.profile||typeof input.profile!=='object'||typeof input.profile.name!=='string'||typeof input.profile.goal!=='string'||!input.profile.name.trim()||!input.profile.goal.trim()||input.profile.name.length>60||input.profile.goal.length>120||!THEMES.includes(input.theme)||!Array.isArray(input.habits)||input.habits.length>100||!input.ticks||typeof input.ticks!=='object'||Array.isArray(input.ticks))throw Error('Invalid HabitLoop backup.');
 const ids=new Set();const habits=input.habits.map(h=>{if(!h||typeof h.id!=='string'||!h.id||h.id.length>100||typeof h.name!=='string'||!h.name.trim()||h.name.length>60||typeof h.emoji!=='string'||h.emoji.length>12||ids.has(h.id))throw Error('Invalid habit record.');ids.add(h.id);return {id:h.id,name:h.name.trim(),emoji:h.emoji}});
 const ticks={};for(const [id,row] of Object.entries(input.ticks)){if(!ids.has(id)||!row||typeof row!=='object'||Array.isArray(row))throw Error('Invalid tick record.');ticks[id]={};for(const [date,value] of Object.entries(row)){if(!validDate(date)||value!==true)throw Error('Invalid date or tick.');ticks[id][date]=true}}
 return {version:1,profile:{name:input.profile.name.trim(),goal:input.profile.goal.trim()},theme:input.theme,habits,ticks};
}
let data=null,storageOK=true;try{let raw=localStorage.getItem(STORE);if(raw)data=validate(JSON.parse(raw))}catch(e){storageOK=false}
let date=now(),year=date.getFullYear(),month=date.getMonth(),view='TODAY',welcomeStep=0,firstHabit='';
function save(){try{localStorage.setItem(STORE,JSON.stringify(data));storageOK=true}catch(e){storageOK=false}updateStorage()}
function updateStorage(){let el=$('#storage');if(el)el.textContent=storageOK?'Saved only in this browser. Back up your data before clearing browser storage.':'Browser storage is unavailable. Changes may not survive a reload.'}
function theme(){document.body.dataset.theme=data?.theme||'RCB'}
function dates(y,m){return Array.from({length:new Date(y,m+1,0).getDate()},(_,i)=>key(y,m,i+1))}
function streak(row){let d=now(),n=0;if(!row[key(d.getFullYear(),d.getMonth(),d.getDate())])d.setDate(d.getDate()-1);while(row[key(d.getFullYear(),d.getMonth(),d.getDate())]){n++;d.setDate(d.getDate()-1)}return n}
function percent(a,b){return b?Math.round(100*a/b):0}
function id(){return globalThis.crypto?.randomUUID?.()||'h-'+Date.now()+'-'+Math.random().toString(36).slice(2)}
/* First-run flow */
function onboarding(){theme();const labels=['Your name','Your main goal','Your first habit'];$('#app').innerHTML=`<header class="header"><div class="logo"><span class="logoMark">↗</span>HabitLoop</div><small>Show up. Keep going.</small></header><main class="welcome"><section class="welcomeCard"><span class="progress">Step ${welcomeStep+1} of 3</span><h1>${['Welcome to HabitLoop.','What are you working toward?','Start with one habit.'][welcomeStep]}</h1><p>${['A little progress, every day. Your tracker starts with a clean slate.','Give this season of your life a direction. You can edit it later.','Add one now, or skip and add it from your empty board.'][welcomeStep]}</p><form id="onboardForm"><label for="onboardInput">${labels[welcomeStep]}</label><input id="onboardInput" maxlength="${[60,120,60][welcomeStep]}" placeholder="${['What should we call you?','e.g. Feel stronger and healthier','e.g. Read for 15 minutes'][welcomeStep]}" ${welcomeStep<2?'required':''} autocomplete="off"><div class="dialogActions">${welcomeStep===2?'<button type="button" class="button" id="skipHabit">Skip for now</button>':''}<button class="button primary" type="submit">${welcomeStep===2?'Start tracking':'Continue'}</button></div></form></section></main>`;
 $('#onboardInput').focus();$('#onboardForm').onsubmit=e=>{e.preventDefault();let value=$('#onboardInput').value.trim();if(welcomeStep<2&&!value)return;if(welcomeStep===0){firstHabit=value;welcomeStep=1;onboarding()}else if(welcomeStep===1){const name=firstHabit;data={version:1,profile:{name,goal:value},theme:'RCB',habits:[],ticks:{}};welcomeStep=2;onboarding()}else completeOnboarding(value)};if(welcomeStep===2)$('#skipHabit').onclick=()=>completeOnboarding('')}
function completeOnboarding(name){if(name)data.habits.push({id:id(),name,emoji:'✨'});save();render()}
/* Shared visual components */
function rings(keys){const eligible=keys.filter(k=>k<=today());return data.habits.length?data.habits.map(h=>{let done=eligible.reduce((n,k)=>n+(data.ticks[h.id]?.[k]?1:0),0),p=percent(done,eligible.length),circ=245.04;return `<div class="ringCard"><div class="ring" role="img" aria-label="${esc(h.name)}: ${done} of ${eligible.length} days completed"><svg viewBox="0 0 88 88" aria-hidden="true"><circle class="track" cx="44" cy="44" r="39"/><circle class="progress" cx="44" cy="44" r="39" stroke-dasharray="${circ}" stroke-dashoffset="${(circ*(1-p/100)).toFixed(2)}"/></svg><strong>${p}%</strong></div><b>${esc(h.emoji)} ${esc(h.name)}</b><small>${done}/${eligible.length} days</small></div>`}).join(''):'<p class="fine">Add a habit to see your consistency rings.</p>'}
function chart(keys){let t=today(),max=Math.max(1,data.habits.length);return `<div class="metric"><div class="metricTitle">Daily run rate <span>Completed habits per day</span></div><div class="chart">${keys.map(k=>{let n=data.habits.reduce((a,h)=>a+(data.ticks[h.id]?.[k]?1:0),0);return `<div class="barSlot" title="${k}: ${n} of ${data.habits.length}"><span class="bar ${k>t?'future':''}" style="height:${k>t?2:Math.max(2,percent(n,max))}%"></span></div>`}).join('')}</div><div class="axis"><span>1</span><span>${Math.ceil(keys.length/2)}</span><span>${keys.length}</span></div></div>`}
function grid(keys){const eligible=keys.filter(k=>k<=today());return `<div class="gridScroll" role="region" aria-label="Monthly habit grid. Scroll sideways to see more dates." tabindex="0"><table id="grid"><thead><tr><th class="habitCol">HABIT</th>${keys.map(k=>`<th class="dayCol ${k===today()?'activeDay':''}">${k.slice(-2)}</th>`).join('')}<th class="statCol">RATE</th><th class="statCol">STREAK</th></tr></thead><tbody>${data.habits.map(h=>{let row=data.ticks[h.id]||{},done=eligible.filter(k=>row[k]).length;return `<tr><th class="habitCol"><button type="button" class="habitName" data-edit="${esc(h.id)}">${esc(h.emoji)} ${esc(h.name)} ✎</button></th>${keys.map(k=>`<td><button type="button" class="tick ${row[k]?'on':''}" data-habit="${esc(h.id)}" data-date="${k}" aria-label="${esc(h.name)}, ${k}: ${row[k]?'done':'not done'}" aria-pressed="${!!row[k]}" ${k>today()?'disabled':''}>${row[k]?'✓':''}</button></td>`).join('')}<td class="statCol">${percent(done,eligible.length)}%</td><td class="statCol">${streak(row)}d</td></tr>`}).join('')}</tbody></table></div>`}
function empty(){return `<div class="empty"><h3>No habits yet</h3><p>Your list is empty. Add a habit and make your first tick.</p><button class="button primary" type="button" data-add>Add your first habit</button></div>`}
function stats(){let t=today(),keys=dates(year,month).filter(k=>k<=t),done=data.habits.reduce((n,h)=>n+keys.filter(k=>data.ticks[h.id]?.[k]).length,0);return `<div class="stats"><div><strong>${percent(done,keys.length*data.habits.length)}%</strong><span>Month consistency</span></div><div><strong>${data.habits.length}</strong><span>Habits</span></div><div><strong>${data.habits.filter(h=>data.ticks[h.id]?.[t]).length}</strong><span>Done today</span></div></div>`}
/* Views and interaction wiring */
function todayView(){let t=today(),done=data.habits.filter(h=>data.ticks[h.id]?.[t]).length;return data.habits.length?`<div class="metric"><div class="metricTitle">Today <span>${done}/${data.habits.length} complete</span></div><div class="list" style="margin-top:16px">${data.habits.map(h=>`<div class="listItem"><span>${esc(h.emoji)} <b>${esc(h.name)}</b> <small class="fine"> · ${streak(data.ticks[h.id]||{})}d streak</small></span><span class="actions"><button class="tick ${data.ticks[h.id]?.[t]?'on':''}" data-habit="${esc(h.id)}" data-date="${t}" aria-label="Toggle ${esc(h.name)} today" aria-pressed="${!!data.ticks[h.id]?.[t]}">${data.ticks[h.id]?.[t]?'✓':''}</button><button class="button" data-edit="${esc(h.id)}" aria-label="Edit ${esc(h.name)}">Edit</button></span></div>`).join('')}</div></div><div class="metric"><div class="metricTitle">Consistency rings <span>${MONTHS[month]} ${year}</span></div><div class="rings">${rings(dates(year,month))}</div></div>`:empty()}
function monthView(){let keys=dates(year,month);return data.habits.length?`${chart(keys)}<div class="metric"><div class="metricTitle">Consistency rings <span>Ticked days / days elapsed</span></div><div class="rings">${rings(keys)}</div></div>${grid(keys)}`:empty()}
function yearView(){return data.habits.length?`<div class="yearGrid">${MONTHS.map((label,m)=>{let keys=dates(year,m).filter(k=>k<=today()),n=data.habits.reduce((sum,h)=>sum+keys.filter(k=>data.ticks[h.id]?.[k]).length,0);return `<div class="yearCell"><span class="eyebrow">${label}</span><br><strong>${percent(n,keys.length*data.habits.length)}%</strong><div class="fine">${n} ticks / ${keys.length} days</div><button class="button" data-month="${m}">View month</button></div>`}).join('')}</div>`:empty()}
function render(){if(!data){onboarding();return}theme();let section=view==='TODAY'?todayView():view==='MONTH'?monthView():yearView();$('#app').innerHTML=`<div class="shell"><header class="header"><div class="logo"><span class="logoMark">↗</span>HabitLoop</div><small>A little progress adds up.</small><div class="headerActions"><button class="button" id="settings">Settings</button></div></header><section class="hero"><span class="eyebrow">${view} / ${MONTHS[month].toUpperCase()} ${year}</span><h1>Keep the loop going${data.profile.name?'\, '+esc(data.profile.name):''}.</h1><p>${esc(data.profile.goal)}</p>${stats()}</section><main class="main"><section class="panel" id="printArea"><div class="toolbar"><div><span class="eyebrow">YOUR PROGRESS</span><h2>${view==='YEAR'?year:MONTHS[month]+' '+year}</h2></div><div class="toolbarRight"><div class="actions"><button class="button" id="pdfBtn" title="Export PDF">PDF</button><button class="button" id="csvBtn" title="Export CSV">CSV</button></div><div class="nav"><button id="prev" aria-label="Previous ${view==='YEAR'?'year':'month'}">‹</button><button id="todayNav">Today</button><button id="next" aria-label="Next ${view==='YEAR'?'year':'month'}">›</button></div></div></div><div class="tabs" role="tablist" aria-label="Progress view">${['TODAY','MONTH','YEAR'].map(v=>`<button role="tab" aria-selected="${view===v}" data-view="${v}">${v}</button>`).join('')}</div><p class="storage" id="storage" role="status"></p><div id="viewContent">${section}</div><div class="bottom"><button class="button primary" data-add>+ Add habit</button><span class="fine">Click a habit's name to edit it. Future days cannot be ticked.</span></div><div class="backup"><span class="eyebrow">Your data</span><div class="actions"><button class="button" id="backupBtn">Backup JSON</button><button class="button" id="restoreBtn">Restore JSON</button></div><input type="file" id="restoreFile" accept=".json,application/json" hidden></div></section></main><footer>Your data stays in this browser. Export a backup before clearing it.</footer></div>`;updateStorage();
 $('#settings').onclick=settings;$('#prev').onclick=()=>shift(-1);$('#next').onclick=()=>shift(1);$('#todayNav').onclick=()=>{let d=now();year=d.getFullYear();month=d.getMonth();view='TODAY';render()};$$('[data-view]').forEach(el=>el.onclick=()=>{view=el.dataset.view;render()});$$('[data-add]').forEach(el=>el.onclick=()=>habitDialog());$$('[data-edit]').forEach(el=>el.onclick=()=>habitDialog(el.dataset.edit));$$('[data-habit]').forEach(el=>el.onclick=()=>toggle(el.dataset.habit,el.dataset.date));$$('[data-month]').forEach(el=>el.onclick=()=>{month=Number(el.dataset.month);view='MONTH';render()});$('#pdfBtn').onclick=exportPDF;$('#csvBtn').onclick=exportCSV;$('#backupBtn').onclick=backup;$('#restoreBtn').onclick=()=>$('#restoreFile').click();$('#restoreFile').onchange=e=>{let f=e.target.files[0];e.target.value='';if(f)restore(f)};
}
const $$=s=>[...document.querySelectorAll(s)];
function shift(n){if(view==='YEAR')year+=n;else{let d=new Date(year,month+n,1);year=d.getFullYear();month=d.getMonth()}render()}
function toggle(id,k){if(k>today()||!data.habits.some(h=>h.id===id))return;let row=data.ticks[id]||{};if(row[k])delete row[k];else row[k]=true;data.ticks[id]=row;save();render()}
/* Dialogs and settings */
function showDialog(html,focus){$('#modal').innerHTML=`<div class="overlay"><div class="dialog" role="dialog" aria-modal="true">${html}</div></div>`;$('.overlay').onclick=e=>{if(e.target.classList.contains('overlay'))closeDialog()};if(focus)$(focus,$('#modal')).focus()}
function closeDialog(){$('#modal').innerHTML=''}
function habitDialog(hid){let h=data.habits.find(x=>x.id===hid);showDialog(`<span class="eyebrow">YOUR ROUTINE</span><h2>${h?'Edit habit':'Add habit'}</h2><form id="habitForm"><label for="habitName">Habit name</label><input id="habitName" maxlength="60" value="${esc(h?.name||'')}" placeholder="e.g. Read for 15 minutes" required><label for="habitEmoji">Emoji</label><input id="habitEmoji" maxlength="12" value="${esc(h?.emoji||'✨')}" placeholder="✨"><div class="dialogActions"><button type="button" class="button" data-close>Cancel</button>${h?'<button type="button" class="button danger" id="deleteHabit">Delete</button>':''}<button type="submit" class="button primary">Save habit</button></div></form>`,'#habitName');$('[data-close]',$('#modal')).onclick=closeDialog;$('#habitForm').onsubmit=e=>{e.preventDefault();let name=$('#habitName').value.trim(),emoji=$('#habitEmoji').value.trim()||'✨';if(!name)return;if(h){h.name=name;h.emoji=emoji}else data.habits.push({id:id(),name,emoji});save();closeDialog();render()};if(h)$('#deleteHabit').onclick=()=>{if(confirm(`Delete "${h.name}" and all its ticks?`)){data.habits=data.habits.filter(x=>x.id!==h.id);delete data.ticks[h.id];save();closeDialog();render()}}}
function settings(){showDialog(`<span class="eyebrow">PERSONALIZE</span><h2>Settings</h2><p class="fine">Switch themes or update your profile. Changes stay in this browser.</p><label>Theme</label>${Object.entries(THEME_GROUPS).map(([group,names])=>`<section class="themeCollection" aria-label="${group} themes"><h3>${group}</h3><div class="choice">${names.map(t=>`<button type="button" class="themeChoice" data-theme-choice="${t}" aria-pressed="${data.theme===t}"><span class="themeDot" style="--swatch:${THEME_SWATCHES[t][0]};--swatch-border:${THEME_SWATCHES[t][1]}" aria-hidden="true"></span>${t}</button>`).join('')}</div></section>`).join('')}<form id="profileForm"><label for="profileName">Your name</label><input id="profileName" maxlength="60" value="${esc(data.profile.name)}" required><label for="profileGoal">Main goal</label><input id="profileGoal" maxlength="120" value="${esc(data.profile.goal)}" required><div class="dialogActions"><button type="button" class="button" data-close>Close</button><button type="submit" class="button primary">Save profile</button></div></form><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><button class="button danger" id="resetAll">Reset all data</button>`,'#profileName');$$('[data-theme-choice]').forEach(el=>el.onclick=()=>{data.theme=el.dataset.themeChoice;save();theme();closeDialog();render();settings()});$('[data-close]',$('#modal')).onclick=closeDialog;$('#profileForm').onsubmit=e=>{e.preventDefault();let name=$('#profileName').value.trim(),goal=$('#profileGoal').value.trim();if(!name||!goal)return;data.profile={name,goal};save();closeDialog();render()};$('#resetAll').onclick=()=>{if(confirm('Reset HabitLoop? This permanently deletes your profile, habits, and ticks in this browser. Export a backup first if you need them.')){localStorage.removeItem(STORE);data=null;welcomeStep=0;firstHabit='';closeDialog();render()}}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').innerHTML)closeDialog()});
/* Export and restore */
function download(blob,filename){let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=filename;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1000)}
function slug(){return view==='YEAR'?String(year):MONTHS[month].toLowerCase()+'-'+year}
function exportCSV(){let keys=dates(year,month),quote=s=>'"'+String(s).replace(/"/g,'""')+'"',rows=[['Habit','Emoji',...keys].map(quote).join(',')];data.habits.forEach(h=>rows.push([h.name,h.emoji,...keys.map(k=>data.ticks[h.id]?.[k]?'1':'0')].map(quote).join(',')));download(new Blob(['\uFEFF'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'}),'habitloop-'+slug()+'.csv')}
function backup(){download(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),'habitloop-backup-'+today()+'.json')}
function restore(file){if(file.size>5*1024*1024){alert('That backup is too large (5 MB maximum).');return}let reader=new FileReader();reader.onload=()=>{try{let restored=validate(JSON.parse(reader.result));if(!confirm('Replace all current HabitLoop data with this backup?'))return;data=restored;save();closeDialog();render();alert('Backup restored.')}catch(e){alert('Restore failed: '+e.message)}};reader.onerror=()=>alert('Could not read that file.');reader.readAsText(file)}
function exportPDF(){let el=$('#printArea');if(typeof html2pdf!=='function'){window.print();return}try{let result=html2pdf().set({margin:8,filename:'habitloop-'+slug()+'.pdf',image:{type:'jpeg',quality:.95},html2canvas:{scale:2,backgroundColor:getComputedStyle(document.body).backgroundColor,useCORS:true,ignoreElements:node=>node.classList?.contains('backup')||node.classList?.contains('toolbarRight')||node.classList?.contains('bottom')},jsPDF:{unit:'mm',format:'a4',orientation:'landscape'}}).from(el).save();if(result?.catch)result.catch(()=>window.print())}catch(e){window.print()}}
render();
})();
</script>
</body>
</html>
